name: PR7 pinned Windows acceptance

on:
  pull_request:
    paths:
      - .github/workflows/pr7-windows-acceptance.yml

permissions:
  contents: read

jobs:
  pinned-windows-tests:
    name: PR7 2c2e7274 on Windows
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      ECHO_ADK_DEBUG: "1"
    steps:
      - name: Check out the immutable reviewed candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: echoomegaprime/echo-adk
          ref: 2c2e7274b17510c9d410869cc5a9763b6af873c5
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify source identity and record Windows runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $candidate -ne '2c2e7274b17510c9d410869cc5a9763b6af873c5') { throw 'Candidate source identity mismatch' }
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0 -or $tree -ne '0c6102c27bf21db8915ee08e6e578ebed32dda92') { throw 'Candidate source tree mismatch' }
          New-Item -ItemType Directory -Path acceptance-results -Force | Out-Null
          [ordered]@{ candidate = $candidate; tree = $tree; runner_os = $env:RUNNER_OS; operating_system = [System.Environment]::OSVersion.VersionString; native_quench_qualification = $false; provider_consent_performed = $false } | ConvertTo-Json | Set-Content -LiteralPath acceptance-results/source-and-runtime.json -Encoding utf8 -Force
          python --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install candidate test dependencies
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -e ".[dev,sdk-host,calendar,connections,browser]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip freeze --all | Set-Content -LiteralPath acceptance-results/dependencies.txt -Encoding utf8 -Force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install a task-owned Chromium for controlled browser acceptance
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $env:RUNNER_TEMP 'pr7-browser-cache'
          New-Item -ItemType Directory -Path $env:PLAYWRIGHT_BROWSERS_PATH -Force | Out-Null
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $browserPath = (python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()" | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not [System.IO.Path]::IsPathRooted($browserPath)) { throw 'Browser path is not absolute' }
          if (-not (Test-Path -LiteralPath $browserPath -PathType Leaf)) { throw 'Task-owned Chromium is missing' }
          $expectedRoot = [System.IO.Path]::GetFullPath($env:PLAYWRIGHT_BROWSERS_PATH).TrimEnd('\') + '\'
          $resolvedBrowser = (Resolve-Path -LiteralPath $browserPath).Path
          if (-not $resolvedBrowser.StartsWith($expectedRoot, [System.StringComparison]::OrdinalIgnoreCase)) { throw 'Browser escaped the task-owned directory' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Force -Value "PLAYWRIGHT_BROWSERS_PATH=$env:PLAYWRIGHT_BROWSERS_PATH"
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Force -Value "ECHO_ADK_BROWSER_TEST_EXECUTABLE=$resolvedBrowser"
          [ordered]@{ executable = $resolvedBrowser; sha256 = (Get-FileHash -LiteralPath $resolvedBrowser -Algorithm SHA256).Hash.ToLowerInvariant(); file_version = (Get-Item -LiteralPath $resolvedBrowser).VersionInfo.FileVersion; playwright_version = '1.62.0'; owner_browser_session_used = $false; provider_consent_performed = $false } | ConvertTo-Json | Set-Content -LiteralPath acceptance-results/browser-runtime.json -Encoding utf8 -Force
      - name: Run the complete candidate suite
        run: |
          python -m pytest -q -ra --junitxml=acceptance-results/pytest.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import xml.etree.ElementTree as ET
          root = ET.parse("acceptance-results/pytest.xml").getroot()
          cases = [case for case in root.iter("testcase") if case.get("classname") == "tests.test_browser_chromium"]
          assert len(cases) == 9, f"Expected 9 browser cases; found {len(cases)}"
          for case in cases:
              assert all(case.find(tag) is None for tag in ("skipped", "failure", "error")), case.get("name")
          print("All 9 controlled Chromium acceptance cases passed.")
          '@ | python -
          exit $LASTEXITCODE
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr7-2c2e7274-windows-results
          path: acceptance-results/
          if-no-files-found: error
          retention-days: 14
